name: Deploy FastAPI MongoDB App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ==========================================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # LOGIN TO GHCR
      # --------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # SET IMAGE NAMES
      # --------------------------------------------------------
      - name: Set image names
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/farm-app-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/farm-app-frontend" >> $GITHUB_ENV
          echo "CELERY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/farm-app-celeryworker" >> $GITHUB_ENV


      # --------------------------------------------------------
      # BUILD BACKEND
      # --------------------------------------------------------
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./farm-app-com/backend
          file: ./farm-app-com/backend/backend.dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          build-args: |
            BACKEND_APP_MODULE=app.main:app
            BACKEND_PRE_START_PATH=/app/prestart.sh
            BACKEND_PROCESS_MANAGER=gunicorn
            BACKEND_WITH_RELOAD=false
            INSTALL_DEV=false


      # --------------------------------------------------------
      # BUILD CELERY WORKER
      # --------------------------------------------------------
      - name: Build and push celery worker
        uses: docker/build-push-action@v6
        with:
          context: ./farm-app-com/backend
          file: ./farm-app-com/backend/celeryworker.dockerfile
          push: true
          tags: |
            ${{ env.CELERY_IMAGE }}:latest
            ${{ env.CELERY_IMAGE }}:${{ github.sha }}
          build-args: |
            INSTALL_DEV=false


      # --------------------------------------------------------
      # BUILD FRONTEND
      # --------------------------------------------------------
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./farm-app-com/frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}


  # ==========================================================
  # DEPLOY TO EC2
  # ==========================================================
  deploy:
    needs: build-and-push

    runs-on: ubuntu-latest

    environment: Secrets

    steps:

      # --------------------------------------------------------
      # CHECKOUT CODE
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # SETUP SSH
      # --------------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts


      # --------------------------------------------------------
      # DEPLOY TO EC2
      # --------------------------------------------------------
      - name: Deploy to EC2
        run: |

          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << 'EOF'

            set -e

            echo "=========================================="
            echo "STARTING DEPLOYMENT"
            echo "=========================================="

            cd "${{ secrets.APP_PATH }}"


            # ====================================================
            # UPDATE SOURCE CODE
            # ====================================================

            echo "Pulling latest code..."

            git fetch origin

            git reset --hard origin/main


            # ====================================================
            # ENTER APPLICATION DIRECTORY
            # ====================================================

            cd farm-app-com

            echo "Application directory:"
            pwd


            # ====================================================
            # CHECK DOCKER
            # ====================================================

            echo "=========================================="
            echo "CHECKING DOCKER"
            echo "=========================================="

            docker --version

            docker compose version


            # ====================================================
            # CHECK DOCKER SWARM
            # ====================================================

            echo "=========================================="
            echo "CHECKING DOCKER SWARM"
            echo "=========================================="

            SWARM_STATE=$(docker info --format '{{.Swarm.LocalNodeState}}')

            echo "Swarm state: $SWARM_STATE"

            if [ "$SWARM_STATE" != "active" ]; then
              echo "ERROR: Docker Swarm is not active."
              exit 1
            fi


            # ====================================================
            # CHECK TRAEFIK NETWORK
            # ====================================================

            echo "=========================================="
            echo "CHECKING TRAEFIK NETWORK"
            echo "=========================================="

            if docker network inspect traefik-public >/dev/null 2>&1; then

              echo "traefik-public network already exists."

            else

              echo "Creating traefik-public overlay network..."

              docker network create \
                --driver overlay \
                --attachable \
                traefik-public

            fi


            # ====================================================
            # VERIFY TRAEFIK NETWORK
            # ====================================================

            docker network inspect traefik-public \
              --format 'Name={{.Name}} Driver={{.Driver}} Scope={{.Scope}}'


            # ====================================================
            # CHECK REQUIRED FILES
            # ====================================================

            echo "=========================================="
            echo "CHECKING REQUIRED FILES"
            echo "=========================================="

            test -f .env
            test -f docker-compose.yml
            test -f conf/rabbitmq.conf
            test -f frontend/.env.local

            echo "All required files are present."


            # ====================================================
            # LOGIN TO GHCR
            # ====================================================

            echo "=========================================="
            echo "LOGIN TO GHCR"
            echo "=========================================="

            echo "${{ secrets.GHCR_READ_TOKEN }}" | \
              docker login ghcr.io \
              -u "${{ github.repository_owner }}" \
              --password-stdin


            # ====================================================
            # SET GHCR IMAGE NAMES
            # ====================================================

            export DOCKER_IMAGE_BACKEND="ghcr.io/${{ github.repository_owner }}/farm-app-backend"

            export DOCKER_IMAGE_FRONTEND="ghcr.io/${{ github.repository_owner }}/farm-app-frontend"

            export DOCKER_IMAGE_CELERYWORKER="ghcr.io/${{ github.repository_owner }}/farm-app-celeryworker"


            # ====================================================
            # SHOW IMAGE CONFIGURATION
            # ====================================================

            echo "=========================================="
            echo "IMAGE CONFIGURATION"
            echo "=========================================="

            echo "Backend:"
            echo "$DOCKER_IMAGE_BACKEND:latest"

            echo "Frontend:"
            echo "$DOCKER_IMAGE_FRONTEND:latest"

            echo "Celery:"
            echo "$DOCKER_IMAGE_CELERYWORKER:latest"


            # ====================================================
            # PULL APPLICATION IMAGES
            # ====================================================

            echo "=========================================="
            echo "PULLING APPLICATION IMAGES"
            echo "=========================================="

            docker pull "$DOCKER_IMAGE_BACKEND:latest"

            docker pull "$DOCKER_IMAGE_FRONTEND:latest"

            docker pull "$DOCKER_IMAGE_CELERYWORKER:latest"


            # ====================================================
            # VALIDATE DOCKER COMPOSE
            # ====================================================

            echo "=========================================="
            echo "VALIDATING DOCKER COMPOSE"
            echo "=========================================="

            docker compose \
              -f docker-compose.yml \
              config > /dev/null

            echo "Docker Compose validation successful."


            # ====================================================
            # DEPLOY DOCKER SWARM STACK
            # ====================================================

            echo "=========================================="
            echo "DEPLOYING DOCKER SWARM STACK"
            echo "=========================================="

            docker stack deploy \
              --with-registry-auth \
              --detach=true \
              -c docker-compose.yml \
              fastapi-app


            # ====================================================
            # WAIT FOR SERVICES
            # ====================================================

            echo "=========================================="
            echo "WAITING FOR SERVICES"
            echo "=========================================="

            sleep 20


            # ====================================================
            # SHOW STACK SERVICES
            # ====================================================

            echo "=========================================="
            echo "STACK SERVICES"
            echo "=========================================="

            docker stack services fastapi-app


            # ====================================================
            # SHOW SERVICE STATUS
            # ====================================================

            echo "=========================================="
            echo "SERVICE STATUS"
            echo "=========================================="

            docker service ps fastapi-app_proxy --no-trunc

            docker service ps fastapi-app_backend --no-trunc

            docker service ps fastapi-app_celeryworker --no-trunc

            docker service ps fastapi-app_frontend --no-trunc

            docker service ps fastapi-app_mongodb --no-trunc

            docker service ps fastapi-app_queue --no-trunc

            docker service ps fastapi-app_flower --no-trunc


            # ====================================================
            # SHOW RUNNING CONTAINERS
            # ====================================================

            echo "=========================================="
            echo "RUNNING CONTAINERS"
            echo "=========================================="

            docker ps


            # ====================================================
            # CHECK SERVICE REPLICAS
            # ====================================================

            echo "=========================================="
            echo "CHECKING SERVICE REPLICAS"
            echo "=========================================="

            docker stack services fastapi-app


            # ====================================================
            # DEPLOYMENT COMPLETE
            # ====================================================

            echo "=========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

          EOF
