name: Production Swarm Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Converts repository name to lower case to prevent Docker tag formatting issues
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/farm-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/backend.dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}-backend:latest

      - name: Build and Push Celery Worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/celeryworker.dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}-celeryworker:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_BASE }}-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Docker Swarm via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/farm-app
            
            # Synchronize local repository changes
            git pull origin main
            
            # Log into GHCR on the production manager host using an active GitHub token
            # Replace YOUR_GITHUB_USERNAME with your lowercase GitHub account handle
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pre-fetch the fresh images to local cache
            docker pull ghcr.io/your_github_username/farm-app-backend:latest
            docker pull ghcr.io/your_github_username/farm-app-celeryworker:latest
            docker pull ghcr.io/your_github_username/farm-app-frontend:latest
            
            # Safely re-deploy to the cluster mesh
            set -a && source .env && set +a
            export TRAEFIK_PUBLIC_NETWORK=traefik-public
            docker stack deploy --with-registry-auth -c docker-compose.yml farm-app-com
