name: Production Swarm Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/farm-app

jobs:

  # ==========================================================
  # BUILD & PUSH
  # ==========================================================
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/backend.dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}-backend:latest

      - name: Build and Push Celery Worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/celeryworker.dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}-celeryworker:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}-frontend:latest


  # ==========================================================
  # DEPLOY TO SWARM
  # ==========================================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to Docker Swarm
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |

            set -e

            echo "=========================================="
            echo "STARTING DEPLOYMENT"
            echo "=========================================="

            cd ~/farm-app

            echo "Pulling latest source code..."

            git fetch origin
            git reset --hard origin/main


            echo "=========================================="
            echo "LOGIN TO GHCR"
            echo "=========================================="

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin


            echo "=========================================="
            echo "PULLING DOCKER IMAGES"
            echo "=========================================="

            docker pull ${{ env.IMAGE_BASE }}-backend:latest

            docker pull ${{ env.IMAGE_BASE }}-celeryworker:latest

            docker pull ${{ env.IMAGE_BASE }}-frontend:latest


            echo "=========================================="
            echo "DEPLOYING SWARM STACK"
            echo "=========================================="

            export IMAGE_BASE=${{ env.IMAGE_BASE }}

            docker stack deploy \
              --with-registry-auth \
              --detach=true \
              -c docker-compose.yml \
              farm-app


            echo "=========================================="
            echo "WAITING FOR SERVICES"
            echo "=========================================="

            sleep 20


            echo "=========================================="
            echo "STACK SERVICES"
            echo "=========================================="

            docker stack services farm-app


            echo "=========================================="
            echo "DEPLOYMENT COMPLETE"
            echo "=========================================="
